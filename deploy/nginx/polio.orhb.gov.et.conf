# ==============================================================================
# OHB OPCMS Additive Nginx Virtual Host Configuration
# Domain: polio.orhb.gov.et (Preserve ODMC/DSpace, IRB & Visitor Portal sites)
# Upstream: 127.0.0.1:3100 (Frontend/BFF) | 127.0.0.1:8100 (FastAPI)
# Note: Enable TLS via Certbot before enforcing PWA Service Worker caching.
# ==============================================================================

server {
    listen 80;
    server_name polio.orhb.gov.et;

    # Redirect HTTP to HTTPS once TLS certificate is installed:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE Endpoints: Disable buffering & extend timeout
    location ~ ^/api/v1/(events|command-room)/stream$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
}

