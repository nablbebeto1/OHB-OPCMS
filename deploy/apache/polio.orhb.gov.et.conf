# ==============================================================================
# OHB OPCMS Additive Apache2 VirtualHost Configuration
# Domain: polio.orhb.gov.et (Preserve ODMC/DSpace, IRB & Visitor Portal sites)
# Requires: a2enmod proxy proxy_http headers rewrite ssl
# ==============================================================================

<VirtualHost *:80>
    ServerName polio.orhb.gov.et

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    # Disable output buffering for SSE endpoints
    <LocationMatch "^/api/v1/(events|command-room)/stream$">
        SetEnv proxy-sendchunked 1
        ProxyPass http://127.0.0.1:3100 retry=0 timeout=3600
        ProxyPassReverse http://127.0.0.1:3100
    </LocationMatch>

    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    ErrorLog ${APACHE_LOG_DIR}/opcms_error.log
    CustomLog ${APACHE_LOG_DIR}/opcms_access.log combined
</VirtualHost>
